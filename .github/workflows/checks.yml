name: checks

on:
  push:
  pull_request:

jobs:
  cores:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog, Verilator and Yosys
        # A broken third-party repository on the runner image must not stop the install
        run: |
          sudo apt-get update || true
          sudo apt-get install -y iverilog verilator yosys
      - name: Lint (Verilator, widths cut short as errors)
        run: sh lint.sh
      - name: One driver a register (Yosys)
        run: sh drivers.sh
      - name: Unit tests
        run: make -C test
